name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cluster_test
          POSTGRES_PASSWORD: cluster_test
          POSTGRES_DB: cluster_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U cluster_test -d cluster_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: Account metrics with PostgreSQL
        working-directory: backend
        env:
          ACCOUNT_METRICS_TEST_DSN: postgres://cluster_test:cluster_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cluster_test?sslmode=disable
        run: go test -race ./internal/repository -run TestAccountMetricsPostgres -count=1 -v
      - name: Cluster operations and resource telemetry with PostgreSQL
        working-directory: backend
        env:
          SUB2API_CLUSTER_TEST_DSN: postgres://cluster_test:cluster_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cluster_test?sslmode=disable
        run: |
          test -n "$SUB2API_CLUSTER_TEST_DSN"
          SUB2API_CLUSTER_SCALE_ROWS=100000 go test -race ./internal/clusterops ./internal/clusterprobe -count=1 -v
          go test -race ./internal/repository -run 'TestCluster.*Postgres' -count=1 -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Build production frontend
        working-directory: frontend
        run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ci-frontend-dist
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 3

  cluster-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test HA deployment inventory
        run: python -m unittest discover -s deploy/ha -p 'test_*.py'
      - name: Install pinned etcd for real quorum tests
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output etcd.tar.gz https://github.com/etcd-io/etcd/releases/download/v3.6.16/etcd-v3.6.16-linux-amd64.tar.gz
          echo 'c8c0d96d8292ef085deabbf735e9561d3d396768e4d606df005aa25964f21911  etcd.tar.gz' | sha256sum --check
          tar -xzf etcd.tar.gz
          echo "ETCD_BIN=$RUNNER_TEMP/etcd-v3.6.16-linux-amd64/etcd" >> "$GITHUB_ENV"
          echo "ETCDCTL_BIN=$RUNNER_TEMP/etcd-v3.6.16-linux-amd64/etcdctl" >> "$GITHUB_ENV"
      - name: Exercise single ownership and lease recovery with three etcd members
        run: bash deploy/ha/test-etcd.sh
      - name: Build pinned HAProxy for real multi-node routing tests
        run: |
          cd "$RUNNER_TEMP"
          # Debian mirrors the original upstream archive (same pinned checksum).
          # Keep CI available when haproxy.org is temporarily unreachable.
          if ! curl --fail --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --output haproxy.tar.gz https://www.haproxy.org/download/3.2/src/haproxy-3.2.26.tar.gz; then
            curl --fail --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --output haproxy.tar.gz https://deb.debian.org/debian/pool/main/h/haproxy/haproxy_3.2.26.orig.tar.gz
          fi
          echo '760ef35fafc1e05844e73ad07e138e9e96fddbf5de02f606249c027f754827da  haproxy.tar.gz' | sha256sum --check
          tar -xzf haproxy.tar.gz
          make -C haproxy-3.2.26 TARGET=linux-glibc -j2
          echo "HAPROXY_BIN=$RUNNER_TEMP/haproxy-3.2.26/haproxy" >> "$GITHUB_ENV"
      - name: Exercise load balancing, affinity, streaming and failover
        working-directory: backend
        run: go test -race ./internal/clusterlb ./internal/server -count=1

  build:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ci-frontend-dist
          path: backend/internal/web/dist/
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build Linux server with embedded frontend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION="$(tr -d '\r\n' < cmd/server/VERSION)"
          mkdir -p ../ci-dist
          go build -tags=embed -trimpath -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$GITHUB_SHA" -o ../ci-dist/sub2api ./cmd/server
          go build -trimpath -ldflags="-s -w" -o ../ci-dist/cluster-runner ./cmd/cluster-runner
          go build -trimpath -ldflags="-s -w" -o ../ci-dist/cluster-config ./cmd/cluster-config
          go build -trimpath -ldflags="-s -w" -o ../ci-dist/cluster-storage-probe ./cmd/cluster-storage-probe
          cp -R ../deploy/ha ../ci-dist/ha
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$GITHUB_SHA" > ../ci-dist/build-info.txt
          cd ../ci-dist
          sha256sum sub2api cluster-runner cluster-config cluster-storage-probe > checksums.txt
          tar -czf sub2api-linux-amd64.tar.gz sub2api cluster-runner cluster-config cluster-storage-probe ha build-info.txt checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-linux-amd64-${{ github.sha }}
          path: ci-dist/sub2api-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
